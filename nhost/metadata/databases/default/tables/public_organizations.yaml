table:
  name: organizations
  schema: public
object_relationships:
  - name: usage_summary
    using:
      manual_configuration:
        column_mapping:
          id: org_id
        insertion_order: null
        remote_table:
          name: org_usage_summary
          schema: public
array_relationships:
  - name: org_members
    using:
      foreign_key_constraint_on:
        column: org_id
        table:
          name: org_members
          schema: public
  - name: workflow_runs
    using:
      foreign_key_constraint_on:
        column: org_id
        table:
          name: workflow_runs
          schema: public
  - name: workflows
    using:
      foreign_key_constraint_on:
        column: org_id
        table:
          name: workflows
          schema: public
insert_permissions:
  - role: user
    permission:
      check: {}
      columns:
        - id
        - name
        - quota_calls_allowed
        - quota_calls_used
        - quota_period_start
        - created_at
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - name
        - quota_calls_allowed
        - quota_calls_used
        - quota_period_start
        - created_at
      filter:
        org_members:
          user_id:
            _eq: X-Hasura-User-Id
update_permissions:
  - role: user
    permission:
      columns:
        - name
        - quota_calls_allowed
        - quota_calls_used
        - quota_period_start
      filter:
        org_members:
          role:
            _eq: owner
          user_id:
            _eq: X-Hasura-User-Id
      check: null
delete_permissions:
  - role: user
    permission:
      filter:
        org_members:
          role:
            _eq: owner
          user_id:
            _eq: X-Hasura-User-Id
