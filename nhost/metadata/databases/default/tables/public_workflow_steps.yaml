table:
  name: workflow_steps
  schema: public
object_relationships:
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
array_relationships:
  - name: step_runs
    using:
      foreign_key_constraint_on:
        column: workflow_step_id
        table:
          name: step_runs
          schema: public
insert_permissions:
  - role: user
    permission:
      check:
        workflow:
          org:
            org_members:
              role:
                _in:
                  - owner
                  - editor
              user_id:
                _eq: X-Hasura-User-Id
      columns:
        - id
        - workflow_id
        - step_order
        - type
        - config
        - required_role
        - created_at
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - workflow_id
        - step_order
        - type
        - config
        - required_role
        - created_at
      filter:
        workflow:
          org:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
update_permissions:
  - role: user
    permission:
      columns:
        - step_order
        - type
        - config
        - required_role
      filter:
        workflow:
          org:
            org_members:
              role:
                _in:
                  - owner
                  - editor
              user_id:
                _eq: X-Hasura-User-Id
      check: null
delete_permissions:
  - role: user
    permission:
      filter:
        workflow:
          org:
            org_members:
              role:
                _in:
                  - owner
                  - editor
              user_id:
                _eq: X-Hasura-User-Id
