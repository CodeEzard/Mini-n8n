table:
  name: org_members
  schema: public
object_relationships:
  - name: org
    using:
      foreign_key_constraint_on: org_id
  - name: organization
    using:
      foreign_key_constraint_on: org_id
insert_permissions:
  - role: user
    permission:
      check:
        org:
          org_members:
            role:
              _eq: owner
            user_id:
              _eq: X-Hasura-User-Id
      columns:
        - id
        - user_id
        - org_id
        - role
        - created_at
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - user_id
        - org_id
        - role
        - created_at
      filter:
        org:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
update_permissions:
  - role: user
    permission:
      columns:
        - role
      filter:
        org:
          org_members:
            role:
              _eq: owner
            user_id:
              _eq: X-Hasura-User-Id
      check: null
delete_permissions:
  - role: user
    permission:
      filter:
        org:
          org_members:
            role:
              _eq: owner
            user_id:
              _eq: X-Hasura-User-Id
