table:
  name: workflow_triggers
  schema: public
object_relationships:
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
insert_permissions:
  - role: user
    permission:
      check:
        workflow:
          org:
            org_members:
              role:
                _in:
                  - owner
                  - editor
              user_id:
                _eq: X-Hasura-User-Id
      columns:
        - id
        - workflow_id
        - type
        - config
        - webhook_secret
        - created_at
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - workflow_id
        - type
        - config
        - webhook_secret
        - created_at
      filter:
        workflow:
          org:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
update_permissions:
  - role: user
    permission:
      columns:
        - type
        - config
        - webhook_secret
      filter:
        workflow:
          org:
            org_members:
              role:
                _in:
                  - owner
                  - editor
              user_id:
                _eq: X-Hasura-User-Id
      check: null
delete_permissions:
  - role: user
    permission:
      filter:
        workflow:
          org:
            org_members:
              role:
                _in:
                  - owner
                  - editor
              user_id:
                _eq: X-Hasura-User-Id
